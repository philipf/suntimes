# GoReleaser builds the archives a release publishes (NFR-1, NFR-5).
#
# The build settings below mirror the Makefile's GOENV, BUILDFLAGS and LDFLAGS,
# so a released binary is the binary `make build` produces — only
# cross-compiled and archived. Change them in both places: release_test.go
# fails if they drift apart.
#
# Locally: `make snapshot` (archives + checksums, no tag, nothing published).
version: 2

project_name: suntimes

# GoReleaser's default anyway, but set explicitly because the Makefile's DIST
# points here too and says so — leaving it implicit lets one move without the
# other noticing.
dist: dist

before:
  hooks:
    # Fail on a missing or mismatched dependency before six builds start,
    # rather than six times over. Downloads only; it never edits go.mod.
    - go mod download

builds:
  - id: suntimes
    main: .
    binary: suntimes
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    # GoReleaser's default ldflags stamp main.version, which this project does
    # not read — the build would succeed, the archive would look right, and the
    # binary inside would report "dev". Stamp internal/buildinfo instead.
    ldflags:
      - -s -w -X github.com/philipf/suntimes/internal/buildinfo.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Datestamp the packaged files from the commit rather than the clock, so
    # rebuilding a tag produces byte-identical archives.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: suntimes
    ids:
      - suntimes
    # tar.gz everywhere except Windows, where zip is what a double-click opens.
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # NFR-7: the binary, the README and the licence. A glob on the last, so a
    # rename to LICENSE.md or LICENCE doesn't silently drop it from the archive.
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

# Release notes, written from the commits between this tag and the previous
# one. `use: git` reads the local git log, which is why the release workflow
# checks out full history — from a shallow clone there is nothing to list.
changelog:
  use: git
  # No `sort`: it orders the notes by commit message text rather than by date,
  # which files every "Add …" above every "fix …" whatever order the work
  # happened in. Left unset, the notes keep git log order — most recent first.
  filters:
    exclude:
      # Merge commits restate what the commits they bring in already say.
      - "^Merge "

release:
  # A tag with a prerelease suffix (v1.0.0-rc.1) publishes as a prerelease, so
  # it neither shows as latest nor gets picked up by anything tracking latest.
  prerelease: auto

snapshot:
  # Marks an untagged local build as what it is, so a snapshot archive is never
  # mistaken for a release one.
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"
