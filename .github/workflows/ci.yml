name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull request supersedes any run still in flight. Pushes to
# main are never cancelled: two merges in quick succession share the group, and
# cancelling would leave the first commit on main with no completed CI status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: gofmt, vet and tests
    runs-on: ubuntu-latest
    # The suite takes well under a minute; anything near this is a hang, and
    # the default ceiling is six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # go-version-file keeps the toolchain pinned to go.mod, so bumping the
      # module's Go version bumps CI with it. cache: true (the default) caches
      # both the module download cache and the build cache, keyed on go.sum.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The same checks as `make check`, run as separate steps so a failure
      # names which one broke.
      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: tests
        run: make test
